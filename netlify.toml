# Hotel Weinberg – Netlify-Konfiguration
#
# Die {lang}/*.html-Dateien werden aus content/*.json + Templates per
# build_*.py erzeugt. Das CMS (Decap/DecapBridge) schreibt beim Speichern
# ABER NUR die JSON-Datei per Git-Commit - es fuehrt KEIN Build-Skript aus.
# Deshalb muss Netlify bei jedem Deploy selbst alle build_*.py-Skripte
# laufen lassen, sonst bleibt die Live-Seite auf dem alten HTML-Stand,
# obwohl die JSON-Datei schon aktualisiert ist (Bug gefunden + behoben am
# 2026-07-29: CMS-Aenderung "Familie Palma" landete in content/index.json,
# aber die Live-Seite zeigte weiter "Familie Schrott").
#
# build_seo.py laeuft ZULETZT und muss das auch bleiben: es arbeitet auf dem
# fertig gebauten HTML und ergaenzt dort canonical, hreflang, Schema.org,
# Bild-Attribute und den styles.css-Cache-Buster; ausserdem schreibt es
# robots.txt und sitemap.xml. Laeuft es vorher, ueberschreiben die anderen
# Skripte seine Ergaenzungen wieder.
[build]
  command = "python3 build_index.py && python3 build_zimmer.py && python3 build_geniessen.py && python3 build_kulinarik.py && python3 build_philosophie.py && python3 build_kontakt.py && python3 build_aktivitaeten.py && python3 build_seo.py"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Assets (Bilder/Videos) aendern sich selten unter demselben Dateinamen -
# lange Cache-Zeit fuer schnellere Ladezeiten.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
