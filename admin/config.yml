              - { label: "Bild-Alt-Text", name: "alt", widget: "string" }
              - { label: "Button-Text (nicht editierbar)", name: "cta_label", widget: "hidden" }

          - label: "11 · Kulinarik-Teaser"
            name: "kulinarik_teaser"
            widget: "object"
            i18n: true
            collapsed: true
            fields:
              - { label: "Kicker", name: "eyebrow", widget: "string" }
              - { label: "Überschrift", name: "heading", widget: "string" }
              - { label: "Fließtext", name: "lede", widget: "text" }
              - label: "Kacheln (4)"
                name: "cards"
                widget: "list"
                summary: "{{fields.label}}"
                fields:
                  - { label: "Bild", name: "image", widget: "image" }
                  - { label: "Beschriftung", name: "label", widget: "string" }
              - { label: "Button-Text (nicht editierbar)", name: "cta_label", widget: "hidden" }

          - label: "11b · Neuigkeiten"
            name: "neuigkeiten"
            widget: "object"
            i18n: true
            collapsed: true
            fields:
              - { label: "Kicker", name: "eyebrow", widget: "string" }
              - { label: "Überschrift", name: "heading", widget: "string" }
              - { label: "Fließtext (kurz)", name: "lede", widget: "string" }
              - { label: "Fließtext (lang)", name: "body", widget: "text" }
              - label: "Bilder (3: Rezeption, Lobby, Bar)"
                name: "images"
                widget: "list"
                summary: "{{fields.label}}"
                fields:
                  - { label: "Bild", name: "image", widget: "image" }
                  - { label: "Alt-Text", name: "alt", widget: "string" }
                  - { label: "Beschriftung", name: "label", widget: "string" }

          - label: "12 · CTA-Banner"
            name: "cta_banner"
            widget: "object"
            i18n: true
            collapsed: true
            fields:
              - { label: "Überschrift", name: "heading", widget: "string" }
              - { label: "Text", name: "text", widget: "string" }
              - { label: "Button-Text (nicht editierbar)", name: "cta_label", widget: "hidden" }

          - { label: "13 · Seitentitel (Browser-Tab, SEO)", name: "meta_title", widget: "string", i18n: true }
          - { label: "14 · Meta-Beschreibung (SEO)", name: "meta_description", widget: "text", i18n: true }

  - name: "aktivitaeten"
    label: "Aktivitäten"
    i18n:
      structure: single_file
      locales: [de, it, en]
    files:
      - file: "content/aktivitaeten.json"
        label: "Aktivitäten (alle Sprachen)"
        name: "aktivitaeten"
        i18n: true
        fields:

          - { label: "1 · Video-Header: Überschrift", name: "hero_heading", widget: "string", i18n: true }
