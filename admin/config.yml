                name: "impressions"
                widget: "list"
                summary: "{{fields.caption}}"
                fields:
                  - { label: "Bild", name: "image", widget: "image" }
                  - { label: "Alt-Text", name: "alt", widget: "string" }
                  - { label: "Beschriftung", name: "caption", widget: "string" }
                  - { label: "Bildausschnitt (leer = Mitte, sonst z. B. 'left' oder 'right')", name: "position", widget: "string", required: false }

          - label: "10 · Zimmer-Verlinkung"
            name: "zimmer_link"
            widget: "object"
            i18n: true
            collapsed: true
            fields:
              - { label: "Kicker", name: "eyebrow", widget: "string" }
              - { label: "Überschrift", name: "heading", widget: "string" }
              - { label: "Fließtext", name: "lede", widget: "text" }
