# Hotel Weinberg – CMS-Konfiguration (Decap CMS)
#
# backend: git-gateway + identity_url/gateway_url auf DecapBridge ist die
# Produktions-Einstellung (Login/Speichern laeuft ueber DecapBridge als
# Ersatz fuer das von Netlify abgekuendigte "Netlify Identity"). Die Site
# ist unter DecapBridge registriert (Login-URL:
# https://hotel-weinberg.netlify.app/admin/index.html).
# local_backend: true sorgt zusaetzlich dafuer, dass Decap CMS automatisch
# auf den lokalen Test-Server (npx decap-server) umschaltet, wenn man die
# Seite ueber "localhost" oeffnet - so kann man weiterhin alles ohne
# DecapBridge/GitHub testen.
backend:
  name: git-gateway
  repo: P17gmbh17/hotel-weinberg
  branch: main
  identity_url: https://auth.decapbridge.com/sites/a6ee5f78-1eea-4a68-8ef9-15a3b36e059b
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: 'Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    update: 'Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    delete: 'Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    uploadMedia: 'Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    deleteMedia: 'Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    openAuthoring: 'Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge'

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://hotel-weinberg.netlify.app

local_backend: true

# Muss auf den GESAMTEN geteilten Bilderordner zeigen, nicht nur auf einen
# Upload-Unterordner: die bestehenden Bilder liegen in mehreren Unterordnern
# (assets/fotos/, assets/aktivitaeten/, assets/kulinarik/, ...) und werden
# in content/index.json als "../assets/<unterordner>/<datei>" referenziert
# (relativ zur jeweiligen {lang}/index.html). Nur wenn public_folder exakt
# zu diesem Praefix passt, kann Decap CMS bestehende Bilder fuer die
# Formular-Thumbnails und die Medienbibliothek korrekt finden. Neue Uploads
# landen dadurch direkt im assets-Hauptordner (Unterordner kann man beim
# Hochladen im Medien-Dialog trotzdem waehlen).
media_folder: "assets"
public_folder: "../assets"

# i18n: DE/IT/EN als Sprach-Tabs im selben Formular, statt getrennter
# Sammlungen. "single_file" ist die einzige i18n-Struktur, die Decap CMS
# fuer Datei-Sammlungen (files:) unterstuetzt - deshalb liegen alle drei
# Sprachen in EINER Datei (content/index.json) mit de/it/en als Top-Level-
# Schluesseln, und build_index.py baut daraus alle drei Sprachversionen.
i18n:
  structure: single_file
  locales: [de, it, en]
  default_locale: de

collections:
  - name: "startseite"
    label: "Startseite"
    i18n:
      structure: single_file
      locales: [de, it, en]
    files:
      - file: "content/index.json"
        label: "Startseite (alle Sprachen)"
        name: "index"
        i18n: true
        fields:

          - label: "1 · Willkommen"
            name: "willkommen"
            widget: "object"
            i18n: true
            collapsed: true
            summary: "{{fields.heading}}"
            hint: "Erster Textabschnitt direkt unter dem Video-Header, mit Bild rechts."
            fields:
              - { label: "Kicker (nicht editierbar)", name: "eyebrow", widget: "hidden", i18n: true }
              - { label: "Überschrift", name: "heading", widget: "string", i18n: true }
              - { label: "Einleitungssatz (fett)", name: "lede", widget: "text", i18n: true }
              - { label: "Fließtext", name: "body", widget: "text", i18n: true }
              - { label: "Button-Text", name: "cta_label", widget: "hidden", i18n: true }
              - { label: "Bild (rechts neben dem Text)", name: "image", widget: "image", i18n: duplicate }

          - label: "2 · Zimmer-Teaser"
            name: "zimmer"
            widget: "object"
            i18n: true
            collapsed: true
            summary: "{{fields.heading}}"
            hint: "Dunkler Abschnitt, verlinkt zur Zimmer-Übersicht."
            fields:
              - { label: "Kicker (nicht editierbar)", name: "eyebrow", widget: "hidden", i18n: true }
              - { label: "Überschrift", name: "heading", widget: "string", i18n: true }
              - { label: "Einleitungssatz", name: "lede", widget: "text", i18n: true }
              - { label: "Bild (links)", name: "image", widget: "image", i18n: duplicate }
              - { label: "Button-Text", name: "cta_label", widget: "hidden", i18n: true }

          - label: "3 · Genießen-Teaser"
            name: "geniessen"
            widget: "object"
            i18n: true
            collapsed: true
            summary: "{{fields.heading}}"
            hint: "Garten, Pool & Frühstück – darunter 3 Bilder nebeneinander."
            fields:
              - { label: "Kicker (nicht editierbar)", name: "eyebrow", widget: "hidden", i18n: true }
              - { label: "Überschrift", name: "heading", widget: "string", i18n: true }
              - { label: "Einleitungssatz", name: "lede", widget: "text", i18n: true }
              - label: "Bildergalerie (3 Bilder nebeneinander)"
                name: "images"
                widget: "list"
                i18n: true
                summary: "{{fields.alt}}"
                fields:
                  - { label: "Bild", name: "image", widget: "image" }
                  - { label: "Alt-Text (Bildbeschreibung für Suchmaschinen)", name: "alt", widget: "string" }
              - { label: "Button-Text", name: "cta_label", widget: "hidden", i18n: true }

          - label: "4 · Aktivitäten-Teaser"
            name: "aktivitaeten"
            widget: "object"
            i18n: true
            collapsed: true
            summary: "{{fields.heading}}"
            hint: "Dunkler Abschnitt mit Hintergrundbild, Filter-Buttons und Tipp-Kacheln pro Kategorie."
            fields:
              - { label: "Hintergrundbild", name: "background_image", widget: "image", i18n: duplicate }
              - { label: "Kicker (nicht editierbar)", name: "eyebrow", widget: "hidden", i18n: true }
              - { label: "Überschrift", name: "heading", widget: "string", i18n: true }
              - { label: "Einleitungssatz", name: "lede", widget: "text", i18n: true }
              - { label: "Button-Text", name: "cta_label", widget: "hidden", i18n: true }
              - label: "Kategorien & Tipps"
                name: "categories"
                widget: "list"
                i18n: true
                summary: "{{fields.label}}"
                hint: "Jede Kategorie ist ein Filter-Button (z. B. „Wandern“) mit 3 Tipp-Karten, die beim Klick als Popup erscheinen."
                fields:
                  - { label: "Interner Schlüssel (keine Leerzeichen, z. B. wandern)", name: "key", widget: "string", pattern: ['^[a-z0-9-]+$', "Nur Kleinbuchstaben, Zahlen und Bindestriche"] }
                  - { label: "Anzeigename (Button-Text)", name: "label", widget: "string" }
                  - label: "Tipps in dieser Kategorie"
                    name: "tips"
                    widget: "list"
                    summary: "{{fields.title}}"
                    fields:
                      - { label: "Titel", name: "title", widget: "string" }
                      - { label: "Dauer (z. B. Kurz / Halbtags / Ganztags)", name: "meta", widget: "string" }
                      - { label: "Bild", name: "image", widget: "image" }

          - label: "5 · Kulinarik-Teaser"
            name: "kulinarik"
            widget: "object"
            i18n: true
            collapsed: true
            summary: "{{fields.heading}}"
            hint: "4 Kacheln mit Bild + Label, verlinken zur Kulinarik-Guide-Seite."
            fields:
              - { label: "Kicker (nicht editierbar)", name: "eyebrow", widget: "hidden", i18n: true }
              - { label: "Überschrift", name: "heading", widget: "string", i18n: true }
              - { label: "Einleitungssatz", name: "lede", widget: "text", i18n: true }
              - label: "Kacheln"
                name: "cards"
                widget: "list"
                i18n: true
                summary: "{{fields.label}}"
                fields:
                  - { label: "Bild", name: "image", widget: "image" }
                  - { label: "Beschriftung (z. B. „Pizza“)", name: "label", widget: "string" }
                  - { label: "Alt-Text (Bildbeschreibung)", name: "alt", widget: "string" }
              - { label: "Button-Text", name: "cta_label", widget: "hidden", i18n: true }

          - label: "6 · CTA-Banner (vor dem Footer)"
            name: "cta_banner"
            widget: "object"
            i18n: true
            collapsed: true
            summary: "{{fields.heading}}"
            fields:
              - { label: "Überschrift", name: "heading", widget: "string", i18n: true }
              - { label: "Text", name: "text", widget: "string", i18n: true }

          - label: "7 · Footer"
            name: "footer"
            widget: "object"
            i18n: true
            collapsed: true
            fields:
              - { label: "Einleitungstext (neben dem Logo)", name: "intro", widget: "text", i18n: true }
              - { label: "Copyright-Zeile", name: "copyright", widget: "string", i18n: true }

          - { label: "Kontaktdaten (nicht editierbar)", name: "contact", widget: "hidden", i18n: duplicate }

          - { label: "Jetzt anfragen-Button", name: "cta_book_label", widget: "hidden", i18n: true }
          - { label: "Jetzt buchen-Button", name: "cta_buchen_label", widget: "hidden", i18n: true }
          - { label: "8 · Scroll-Hinweis unten im Video-Header", name: "hero_scroll_label", widget: "string", i18n: true }
          - { label: "Zweiter Hero-Button", name: "hero_cta_secondary_label", widget: "hidden", i18n: true }

          - { label: "9 · Seitentitel (Browser-Tab, SEO)", name: "meta_title", widget: "string", i18n: true, hint: "Erscheint im Browser-Tab und bei Google als Titel." }
          - { label: "10 · Meta-Beschreibung (SEO)", name: "meta_description", widget: "text", i18n: true, hint: "Der graue Text, den Google unter dem Titel anzeigt. Wird nicht auf der Seite selbst angezeigt." }

  - name: "zimmer"
    label: "Zimmer"
    i18n:
      structure: single_file
      locales: [de, it, en]
    files:
      - file: "content/zimmer.json"
        label: "Zimmer (Übersicht + alle Kategorien, alle Sprachen)"
        name: "zimmer"
        i18n: true
        fields:

          - { label: "1 · Übersichtsseite: Überschrift im Video-Header", name: "hero_heading", widget: "string", i18n: true }
          - { label: "2 · Übersichtsseite: Untertitel im Header", name: "hero_text", widget: "text", i18n: true }
          - { label: "3 · Übersichtsseite: Überschrift über den Zimmerkarten", name: "overview_heading", widget: "string", i18n: true }

          - label: "4 · Zimmerkategorien (Karten, Detailseiten, Galerie)"
            name: "rooms"
            widget: "list"
            i18n: true
            summary: "{{fields.title}}"
            hint: "Eine Karte pro Zimmerkategorie. Erscheint auf der Übersichtsseite UND erzeugt die eigene Detailseite (zimmer-<Schlüssel>.html)."
            fields:
              - { label: "Interner Schlüssel (nicht ändern - wird für Datei- und Linknamen verwendet)", name: "slug", widget: "string", pattern: ['^[a-z0-9-]+$', "Nur Kleinbuchstaben, Zahlen und Bindestriche"] }
              - { label: "Titel (Detailseite, Bild-Beschreibung, verwandte Zimmer)", name: "title", widget: "string" }
              - { label: "Titel auf der Karte, falls kürzer (sonst wie oben)", name: "card_title", widget: "string", hint: "Wird nur auf der Übersichtskarte angezeigt, z. B. bei langen Namen." }
              - { label: "Kurzbeschreibung (Karte)", name: "teaser", widget: "string" }
              - { label: "Bild (Karte + Header der Detailseite)", name: "image", widget: "image" }
              - { label: "Preis (nur die Zahl, z. B. 63)", name: "price", widget: "string", pattern: ['^[0-9]+$', "Nur Zahlen"] }
              - { label: "Fließtext (Detailseite)", name: "lede", widget: "text" }
              - { label: "Meta-Beschreibung Detailseite (SEO)", name: "detail_meta_description", widget: "text" }
              - label: "Bildergalerie / Impressionen-Slider (max. 4 Bilder: 2 Winkel vom Zimmer, Bad, Merkmal/Detail)"
                name: "gallery"
                widget: "list"
                field: { label: "Bild", name: "image", widget: "image" }
              - { label: "Ausstattungs-Icons (nicht editierbar)", name: "amenities_html", widget: "hidden" }

          - { label: "5 · Eyebrow Zimmerkategorie (über der Überschrift, alle Detailseiten)", name: "room_category_eyebrow", widget: "string", i18n: true }
          - { label: "6 · Eyebrow Impressionen (über der Galerie, alle Detailseiten)", name: "gallery_eyebrow", widget: "string", i18n: true }
          - { label: "7 · Überschrift Weitere Zimmerkategorien (alle Detailseiten)", name: "related_heading", widget: "string", i18n: true }
          - { label: "Button-Text Entdecken, nicht editierbar (Karten + verwandte Zimmer)", name: "card_cta_label", widget: "hidden", i18n: true }

          - { label: "8 · Übersichtsseite Slideshow: Eyebrow", name: "slideshow_eyebrow", widget: "string", i18n: true }
          - { label: "9 · Übersichtsseite Slideshow: Überschrift", name: "slideshow_heading", widget: "string", i18n: true }
          - label: "9b · Übersichtsseite Slideshow: Bilder"
            name: "slideshow_images"
            widget: "list"
            hint: "Frei wählbare Bilder für den großen Slider auf der Zimmer-Übersichtsseite (Details & emotionale Aufnahmen, keine Wiederholung der Zimmerkategorien)."
            field: { label: "Bild", name: "image", widget: "image" }

          - { label: "10 · Übersichtsseite CTA-Banner: Überschrift", name: "cta_heading", widget: "string", i18n: true }
          - { label: "11 · Übersichtsseite CTA-Banner: Text", name: "cta_text", widget: "string", i18n: true }
          - { label: "Button-Text CTA-Banner, nicht editierbar", name: "cta_label", widget: "hidden", i18n: true }

          - { label: "12 · Seitentitel Übersichtsseite (Browser-Tab, SEO)", name: "meta_title", widget: "string", i18n: true, hint: "Erscheint im Browser-Tab und bei Google als Titel." }
          - { label: "13 · Meta-Beschreibung Übersichtsseite (SEO)", name: "meta_description", widget: "text", i18n: true }

  - name: "geniessen"
    label: "Genießen"
    i18n:
      structure: single_file
      locales: [de, it, en]
    files:
      - file: "content/geniessen.json"
        label: "Genießen (alle Sprachen)"
        name: "geniessen"
        i18n: true
        fields:

          - { label: "1 · Video-Header: Überschrift", name: "hero_heading", widget: "string", i18n: true }
          - { label: "2 · Video-Header: Untertitel", name: "hero_text", widget: "text", i18n: true }
          - { label: "3 · Kicker über der Einleitung", name: "story_eyebrow", widget: "string", i18n: true }
          - { label: "4 · Einleitungssatz", name: "story_lede", widget: "text", i18n: true }
          - { label: "5 · Scroll-Hinweis (z. B. Los geht's)", name: "story_scroll_label", widget: "string", i18n: true }
          - { label: "6 · Wort für Bildunterschriften-Leiste (z. B. Impressionen)", name: "impressions_prefix", widget: "string", i18n: true }

          - label: "7 · Station 1 · Pool"
            name: "pool"
            widget: "object"
            i18n: true
            collapsed: true
            summary: "{{fields.heading}}"
            fields:
              - { label: "Hintergrundbild", name: "background_image", widget: "image", i18n: duplicate }
              - { label: "Bild-Alt-Text", name: "background_alt", widget: "string" }
              - { label: "Kicker", name: "eyebrow", widget: "string" }
              - { label: "Überschrift", name: "heading", widget: "string" }
              - { label: "Fließtext", name: "lede", widget: "text" }
              - label: "Häkchen-Liste"
                name: "tick_list"
                widget: "list"
                field: { label: "Punkt", name: "item", widget: "string" }
              - label: "Impressionen-Bilder (3)"
                name: "impressions"
                widget: "list"
                summary: "{{fields.caption}}"
                fields:
                  - { label: "Bild", name: "image", widget: "image" }
                  - { label: "Alt-Text", name: "alt", widget: "string" }
                  - { label: "Beschriftung", name: "caption", widget: "string" }
                  - { label: "Bildausschnitt (leer = Mitte, sonst z. B. 'left' oder 'right')", name: "position", widget: "string", required: false }

          - label: "8 · Station 2 · Garten"
            name: "garten"
            widget: "object"
            i18n: true
            collapsed: true
            summary: "{{fields.heading}}"
            fields:
              - { label: "Hintergrundbild", name: "background_image", widget: "image", i18n: duplicate }
              - { label: "Bild-Alt-Text", name: "background_alt", widget: "string" }
              - { label: "Kicker", name: "eyebrow", widget: "string" }
              - { label: "Überschrift", name: "heading", widget: "string" }
              - { label: "Fließtext (fett)", name: "lede", widget: "text" }
              - { label: "Fließtext (zusätzlich)", name: "body", widget: "text" }
              - label: "Impressionen-Bilder (3)"
                name: "impressions"
                widget: "list"
                summary: "{{fields.caption}}"
                fields:
                  - { label: "Bild", name: "image", widget: "image" }
                  - { label: "Alt-Text", name: "alt", widget: "string" }
                  - { label: "Beschriftung", name: "caption", widget: "string" }
                  - { label: "Bildausschnitt (leer = Mitte, sonst z. B. 'left' oder 'right')", name: "position", widget: "string", required: false }

          - label: "9 · Station 3 · Frühstück"
            name: "fruehstueck"
            widget: "object"
            i18n: true
            collapsed: true
            summary: "{{fields.heading}}"
            fields:
              - { label: "Hintergrundbild", name: "background_image", widget: "image", i18n: duplicate }
              - { label: "Bild-Alt-Text", name: "background_alt", widget: "string" }
              - { label: "Kicker", name: "eyebrow", widget: "string" }
              - { label: "Überschrift", name: "heading", widget: "string" }
              - { label: "Fließtext (fett)", name: "lede", widget: "text" }
              - { label: "Fließtext Desktop (ausführlich)", name: "body_desktop", widget: "text" }
              - { label: "Fließtext Mobile (kurz)", name: "body_mobile", widget: "text" }
              - { label: "Button-Text (nicht editierbar)", name: "cta_label", widget: "hidden" }
              - label: "Impressionen-Bilder (3)"
                name: "impressions"
                widget: "list"
                summary: "{{fields.caption}}"
                fields:
                  - { label: "Bild", name: "image", widget: "image" }
                  - { label: "Alt-Text", name: "alt", widget: "string" }
                  - { label: "Beschriftung", name: "caption", widget: "string" }
                  - { label: "Bildausschnitt (leer = Mitte, sonst z. B. 'left' oder 'right')", name: "position", widget: "string", required: false }

          - label: "9b · Station 4 · Bar"
            name: "bar"
            widget: "object"
            i18n: true
            collapsed: true
            summary: "{{fields.heading}}"
            fields:
              - { label: "Hintergrundbild", name: "background_image", widget: "image", i18n: duplicate }
              - { label: "Bild-Alt-Text", name: "background_alt", widget: "string" }
              - { label: "Kicker", name: "eyebrow", widget: "string" }
              - { label: "Überschrift", name: "heading", widget: "string" }
              - { label: "Fließtext (fett)", name: "lede", widget: "text" }
              - { label: "Fließtext (zusätzlich)", name: "body", widget: "text" }
